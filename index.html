<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-title">المحادثات</div>
      </div>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="ابحث عن Session..." />
      </div>

      <div id="conversations" class="conversation-list"></div>
    </aside>

    <main class="chat-panel">
      <div class="chat-header">
        <div>
          <div class="chat-title" id="chatTitle">اختر محادثة</div>
          <div class="chat-subtitle" id="chatSubtitle">WhatsApp Dashboard</div>
        </div>
      </div>

      <div id="messages" class="messages"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
