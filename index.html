<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>WhatsApp Dashboard</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#202c33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-title">المحادثات</div>
      </div>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="ابحث عن Session..." />
      </div>

      <div id="conversations" class="conversation-list"></div>
    </aside>

    <main class="chat-panel">
     <div class="chat-header">
  <button id="backToChatsBtn" class="back-to-chats-btn" type="button">‹</button>

  <div>
          <div class="chat-title" id="chatTitle">اختر محادثة</div>
          <div class="chat-subtitle" id="chatSubtitle">WhatsApp Dashboard</div>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div class="chat-input-bar">
        <input id="messageInput" type="text" placeholder="اكتب رسالة..." autocomplete="off" />
        <button id="sendBtn" type="button">إرسال</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.log('SW Error', err));
    }
  </script>
</body>
</html>
